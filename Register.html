<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="css/RegisterStyles.css">
    <link rel="stylesheet" href="css/HomeStyle.css">
</head>
<body>
    <header>
        
        <a href="Home.html"><div class="logo"><img src="img/Logo PNG.png" alt="Logo de Hospital"></div></a>

        <nav class="navbar">
            <a href="Turno.html">Solicitud de Turno</a>
            <a href="#Home">Acerca de</a>
            <a href="#Home">Servicios</a>
            <a href="#Home">Contacto</a>
            <a href="Admin.html">Admin</a>
            <a href="Register.html">Regristrarse</a>
        </nav>
    </header>

    <div class="container">
        <h1>Registro</h1>
        <form id="registerForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="fullName">Nombre Completo:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="lastName">Apellido:</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
            <div class="form-group">
                <label for="nick">Nick:</label>
                <input type="text" id="nick" name="nick" required>
            </div>
            <div class="form-group">
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" required>
            </div>
            <div class="form-group">
                <label for="phone">Teléfono:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <div class="form-group">
                <label for="profileImage">Foto de Perfil:</label>
                <input type="file" id="profileImage" name="profileImage" accept="image/*" required>
            </div>
            <button type="submit">Registrarse</button>
        </form>
    </div>
    <script src="js/RegisterScript.js"></script>
</body>
</html>
